name: CI

# Trigger: chạy khi push lên main, hoặc khi mở/cập nhật PR
on:
  push:
    branches: [main]
  pull_request:

# Quyền tối thiểu cho token của workflow (chỉ đọc code)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    # chỉ chạy khi lint VÀ test đều xanh (giống downstream task trong Airflow)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t expense-bot:${{ github.sha }} .
