services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}   # chỉ là mặc định cho máy dev
      POSTGRES_DB: expense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://expense:${POSTGRES_PASSWORD:-devpassword}@db:5432/expense
    depends_on:
      db:
        condition: service_healthy

  # DB dùng riêng cho test, xoá sạch khi tắt. Chỉ chạy khi gọi: --profile test
  db_test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
